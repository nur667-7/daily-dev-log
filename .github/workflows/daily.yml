name: Daily learning entry

on:
  schedule:
    - cron: "23 0 * * *"
  workflow_dispatch:
    inputs:
      smoke_test:
        description: "Create or refresh a small workflow verification record"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-learning-entry
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate today's entry
        run: python3 generate_daily.py

      - name: Record a manual workflow verification
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.smoke_test }}
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          printf '{\n  "workflow_run_id": "%s",\n  "attempt": "%s",\n  "verified_at_utc": "%s"\n}\n' \
            "$RUN_ID" \
            "$RUN_ATTEMPT" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > data/automation-smoke-test.json

      - name: Commit a real content change
        env:
          BOT_NAME: nur667-7
          BOT_EMAIL: 214433287+nur667-7@users.noreply.github.com
        run: |
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git add data

          if git diff --cached --quiet; then
            echo "No new UTC-date entry to commit."
            exit 0
          fi

          day="$(date -u +%F)"
          git commit -m "chore(daily): automated learning entry ${day} [bot]"
          git push
